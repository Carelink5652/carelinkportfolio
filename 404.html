<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — CareLink</title>
    <meta name="description" content="The page you're looking for could not be found.">
    
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="shortcut icon" href="./favicon.svg">
    
    <style>
        :root {
            --color-bg: #080B12;
            --color-surface: #101522;
            --color-accent: #4F46E5;
            --color-accent-light: #818CF8;
            --color-text: #F8FAFC;
            --color-text-muted: #94A3B8;
            --color-border: #1E293B;
            --font-heading: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-body: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .error-container {
            text-align: center;
            max-width: 600px;
        }

        .error-code {
            font-family: var(--font-heading);
            font-size: 6rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1rem;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.1rem;
            color: var(--color-text-muted);
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.875rem 2rem;
            border-radius: 0.5rem;
            font-family: var(--font-heading);
            font-weight: 600;
            text-decoration: none;
            transition: all 300ms ease;
        }

        .btn-primary {
            background-color: var(--color-accent);
            color: #0F1117;
            border: 2px solid var(--color-accent);
        }

        .btn-primary:hover {
            background-color: var(--color-accent-light);
            border-color: var(--color-accent-light);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(79, 70, 229, 0.2);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--color-text);
            border: 2px solid var(--color-border);
        }

        .btn-secondary:hover {
            background-color: var(--color-surface);
            border-color: var(--color-accent);
            transform: translateY(-2px);
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 3rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .buttons {
                flex-direction: column;
            }

            a {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">🔍</div>
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>Sorry, the page you're looking for doesn't exist. It might have been moved or deleted.</p>
        <div class="buttons">
            <a href="./" class="btn-primary">Back to Home</a>
            <a href="./#contact" class="btn-secondary">Get in Touch</a>
        </div>
    </div>
</body>
</html>
